name: Weekly policy and link check

on:
  schedule:
    # Mondays at 11:00 UTC (~6 AM Central). GitHub cron uses UTC.
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check watched policy pages for changes
        run: python scripts/check_policies.py

      - name: Check internal links and source coverage
        run: python scripts/check_links.py --internal

      - name: Check all external links (repair moved/dead URLs)
        run: python scripts/check_links.py --external

      - name: Commit and push any detected changes
        id: commit
        run: |
          git config user.name "policy-check-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Weekly policy and link check: $(date -u +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger the push-based deploy
      # workflow, so redeploy the site explicitly when data changed.
      - name: Redeploy site with updated data
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
